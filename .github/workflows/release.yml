name: Build & Release Host Runtime

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty for auto date tag)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build-host Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build-host APT dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config autoconf automake libtool \
            zstd patchelf curl git xz-utils bzip2

      - name: Set up Android NDK r28
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28b
          add-to-path: false

      - name: Resolve and fetch latest upstream sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 fetch.py

      - name: Determine release tag
        id: rel
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(date -u +%Y.%m.%d)-r${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Cross-compile and package runtime
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: python3 build.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: "Mobile Harness Host Runtime ${{ steps.rel.outputs.tag }}"
          make_latest: true
          files: |
            dist/mh-host-runtime-arm64.tar.zst
            dist/mhr-manifest.json
